[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masamune"
version = "1.0.0"
description = "Masamune terminal UI for building Morphe artifacts from local APKs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikel Villota" }]

requires-python = ">=3.11,<3.14"
keywords = ["android", "apk", "morphe", "patcher", "terminal-ui", "masamune"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "axml==0.0.2",
  "rich>=13",
  "textual==6.6.0",
  "tomlkit==0.13.2",
]

[project.urls]
Repository = "https://github.com/Villoh/masamune"
Issues = "https://github.com/Villoh/masamune/issues"

[project.scripts]
masamune = "masamune.cli:main"

[tool.uv]
exclude-newer = "3 days"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
masamune = ["tui/*.tcss"]
