[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "morphe-tui"
version = "0.1.0"
description = "Terminal UI for building Morphe artifacts from user-supplied local APKs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mikel Villota" }]
requires-python = ">=3.11,<3.14"
keywords = ["android", "apk", "morphe", "patcher", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "axml==0.0.2",
  "rich>=13",
  "textual==6.6.0",
  "tomlkit==0.13.2",
]

[project.scripts]
morphe-tui = "morphe_tui.cli:main"

[tool.uv]
exclude-newer = "3 days"

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
morphe_tui = ["tui/*.tcss"]
